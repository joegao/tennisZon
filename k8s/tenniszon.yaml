apiVersion: v1
kind: Namespace
metadata:
  name: tenniszon
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenniszon
  namespace: tenniszon
  annotations:
    iam.gke.io/gcp-service-account: tenniszon-gke@project-b8eb1b3e-fa96-470b-9f2.iam.gserviceaccount.com
    iam.gke.io/return-principal-id-as-email: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenniszon
  namespace: tenniszon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenniszon
  template:
    metadata:
      labels:
        app: tenniszon
    spec:
      serviceAccountName: tenniszon
      containers:
        - name: application
          image: northamerica-northeast1-docker.pkg.dev/project-b8eb1b3e-fa96-470b-9f2/tenniszon/tenniszon:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: tenniszon
            - name: DB_USERNAME
              value: tenniszon-gke@project-b8eb1b3e-fa96-470b-9f2.iam
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--auto-iam-authn"
            - "--structured-logs"
            - "--address=127.0.0.1"
            - "--port=5432"
            - "457b7930daa9.2822fvbq51gyf.northamerica-northeast1.sql-psc.goog"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tenniszon
  namespace: tenniszon
spec:
  type: LoadBalancer
  selector:
    app: tenniszon
  ports:
    - name: http
      port: 80
      targetPort: http
